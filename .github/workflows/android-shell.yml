name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$SHELL_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      # 自动去掉密码 Secret 里可能混入的空格/换行/回车
      - name: Normalize password secrets
        if: ${{ env.SHELL_KEYSTORE_FILE != '' }}
        run: |
          CLEAN_STORE=$(printf '%s' "$SHELL_KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          CLEAN_KEY=$(printf '%s' "$SHELL_KEY_PASSWORD" | tr -d ' \t\r\n')
          echo "SHELL_KEYSTORE_PASSWORD=$CLEAN_STORE" >> "$GITHUB_ENV"
          echo "SHELL_KEY_PASSWORD=$CLEAN_KEY" >> "$GITHUB_ENV"

      - name: Verify keystore (diagnose)
        if: ${{ env.SHELL_KEYSTORE_FILE != '' }}
        run: |
          echo "== 1. 密钥库文件大小 =="
          wc -c /tmp/shell.keystore
          echo "== 2. 用清洗后的密码尝试打开 =="
          if openssl pkcs12 -info -in /tmp/shell.keystore -passin "pass:$SHELL_KEYSTORE_PASSWORD" -noout 2>/tmp/ks-err.txt; then
            echo "OK: 密码正确，能打开密钥库"
          else
            echo "FAIL: 打不开！openssl 错误信息："
            cat /tmp/ks-err.txt
          fi

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
